<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dakon Pro - Battle Online</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; margin: 0; padding: 20px; color: #333; overflow-x: hidden; }
        
        /* Overlay Suit */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; color: white; backdrop-filter: blur(5px); }
        .suit-card { background: white; padding: 30px; border-radius: 20px; text-align: center; color: #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .suit-btns { display: flex; gap: 20px; margin-top: 20px; }
        .suit-btn { font-size: 3rem; background: #f0f2f5; border: 3px solid #ddd; border-radius: 15px; cursor: pointer; transition: 0.2s; padding: 10px; width: 100px; }
        .suit-btn:hover { transform: translateY(-5px); border-color: #764ba2; background: #f3f0ff; }
        .suit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* Game Board Styles */
        .section { background: rgba(255, 255, 255, 0.95); border-radius: 40px; padding: 2rem; max-width: 1100px; margin: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .game-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .player-info { background: #dfe6e9; padding: 15px 30px; border-radius: 20px; min-width: 150px; text-align: center; transition: 0.4s; border: 4px solid transparent; }
        .current-player { border-color: #764ba2; background: #fff; box-shadow: 0 0 20px rgba(118, 75, 162, 0.3); transform: scale(1.05); }
        
        /* Board Design */
        .dakon-wood { background: #5d3a1a; padding: 40px; border-radius: 100px; box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 15px 30px rgba(0,0,0,0.4); display: flex; align-items: center; gap: 20px; margin: 20px auto; position: relative; border: 10px solid #4a2e15; }
        .pit-container { display: grid; grid-template-columns: repeat(7, 1fr); gap: 20px; flex-grow: 1; }
        .pit { width: 75px; height: 75px; background: radial-gradient(circle at 30% 30%, #8d5524, #5d3a1a); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: bold; color: #fff; box-shadow: inset 0 5px 15px rgba(0,0,0,0.6), 0 2px 5px rgba(255,255,255,0.1); cursor: not-allowed; transition: 0.2s; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .store { width: 110px; height: 220px; background: radial-gradient(circle at 50% 20%, #a67c52, #5d3a1a); border-radius: 60px; display: flex; align-items: center; justify-content: center; color: #ffd700; font-size: 3rem; font-weight: 900; box-shadow: inset 0 8px 20px rgba(0,0,0,0.7); text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        
        /* Interactive Pits */
        .active-p1 { cursor: pointer !important; box-shadow: inset 0 5px 15px rgba(0,0,0,0.6), 0 0 15px #6c5ce7; }
        .active-p2 { cursor: pointer !important; box-shadow: inset 0 5px 15px rgba(0,0,0,0.6), 0 0 15px #ff7675; }
        .pit:hover.active-p1, .pit:hover.active-p2 { transform: scale(1.1); filter: brightness(1.2); }

        .notification { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #2d3436; color: white; padding: 12px 30px; border-radius: 30px; display: none; z-index: 3000; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="notif" class="notification"></div>

    <div id="suit-overlay" class="overlay">
        <div class="suit-card">
            <h2>🖐️ SUIT DULU! ✌️</h2>
            <p>Tentukan siapa yang jalan duluan</p>
            <div class="suit-btns">
                <button class="suit-btn" onclick="submitSuit('Batu')"></button>
                <button class="suit-btn" onclick="submitSuit('Gunting')">✂️</button>
                <button class="suit-btn" onclick="submitSuit('Kertas')">📄</button>
            </div>
            <p id="suit-msg" style="margin-top: 15px; color: #666; font-style: italic;">Pilih salah satu...</p>
        </div>
    </div>

    <div class="section">
        <div class="game-info">
            <div class="player-info" id="p1-info">
                <div id="p1-name">Host</div>
                <h2 id="p1-score">0</h2>
            </div>
            <div style="text-align: center">
                <h1>Dakon Benevolent</h1>
                <h3 id="status">Menghubungkan...</h3>
                <small id="room-display" style="background:#eee; padding:5px 10px; border-radius:10px;"></small>
            </div>
            <div class="player-info" id="p2-info">
                <div id="p2-name">Guest</div>
                <h2 id="p2-score">0</h2>
            </div>
        </div>

        <div id="board-container"></div>

        <div style="text-align: center; margin-top: 30px;">
            <button onclick="window.location.href='index.html'" style="background:#636e72; color:white; padding:10px 25px; border-radius:10px; border:none; cursor:pointer; font-weight:bold;">🚪 Keluar ke Menu</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://yifnqncmsgbkvvjdgwae.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_F47wIask3Ld1QT8Hfvgu-Q_hxHPnYRj';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const params = new URLSearchParams(window.location.search);
        const myRole = params.get('role');
        const roomID = params.get('room');
        const hName = params.get('hostName') || "Host";
        const gName = params.get('myName') || "Guest";

        class DakonGame {
            constructor() {
                this.board = Array(16).fill(7);
                this.board[7] = 0;  // Lubang besar Host
                this.board[15] = 0; // Lubang besar Guest
                this.currentPlayer = 0; // 0 = Menunggu Suit
                this.gameActive = true;
                this.animationRunning = false;
                
                document.getElementById('p1-name').textContent = hName;
                document.getElementById('p2-name').textContent = gName;
                document.getElementById('room-display').textContent = "ROOM ID: " + roomID;

                this.renderBoard();
                this.initRealtime();
                this.checkSuitStatus();
            }

            // --- SISTEM SUIT ---
            async checkSuitStatus() {
                const { data } = await supabaseClient.from('rooms').select('*').eq('room_id', roomID).single();
                if (data && data.suit_host && data.suit_guest) {
                    this.processSuitResult(data.suit_host, data.suit_guest);
                }
            }

            processSuitResult(h, g) {
                if (h === g) {
                    document.getElementById('suit-msg').textContent = "Seri! Pilih ulang...";
                    this.resetSuitDB();
                    return;
                }
                
                let hostWin = (h==='Batu'&&g==='Gunting') || (h==='Gunting'&&g==='Kertas') || (h==='Kertas'&&g==='Batu');
                this.currentPlayer = hostWin ? 1 : 2;
                
                document.getElementById('suit-overlay').classList.add('hidden');
                this.showNotif(hostWin ? "Host Jalan Duluan!" : "Guest Jalan Duluan!");
                this.updateUI();
                this.renderBoard();
            }

            async resetSuitDB() {
                await supabaseClient.from('rooms').update({ suit_host: null, suit_guest: null }).eq('room_id', roomID);
            }

            // --- REALTIME ---
            async initRealtime() {
                supabaseClient.channel(`room_${roomID}`)
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rooms', filter: `room_id=eq.${roomID}` }, (payload) => {
                    const data = payload.new;
                    
                    // Cek Suit
                    if (this.currentPlayer === 0 && data.suit_host && data.suit_guest) {
                        this.processSuitResult(data.suit_host, data.suit_guest);
                    }

                    // Cek Gerakan Lawan
                    if (data.last_move_by !== myRole && data.last_move !== null) {
                        this.makeMove(parseInt(data.last_move), false);
                    }
                }).subscribe();
            }

            // --- LOGIKA GAME ---
            renderBoard() {
                const container = document.getElementById('board-container');
                container.innerHTML = '';
                const boardEl = document.createElement('div');
                boardEl.className = 'dakon-wood';
                
                boardEl.appendChild(this.createStore(15)); // Lubang Guest (Kiri)
                
                const pitsGrid = document.createElement('div');
                pitsGrid.className = 'pit-container';
                
                // Baris Atas (Punya Guest 14 ke 8)
                for(let i = 14; i >= 8; i--) pitsGrid.appendChild(this.createPit(i));
                // Baris Bawah (Punya Host 0 ke 6)
                for(let i = 0; i <= 6; i++) pitsGrid.appendChild(this.createPit(i));
                
                boardEl.appendChild(pitsGrid);
                boardEl.appendChild(this.createStore(7)); // Lubang Host (Kanan)
                container.appendChild(boardEl);
            }

            createPit(index) {
                const pit = document.createElement('div');
                pit.className = 'pit';
                pit.id = `pit-${index}`;
                pit.textContent = this.board[index];
                
                const isP1Pit = index <= 6;
                const isP2Pit = index >= 8 && index <= 14;

                if (this.gameActive && !this.animationRunning && this.board[index] > 0 && this.currentPlayer !== 0) {
                    if (this.currentPlayer === 1 && isP1Pit && myRole === 'host') {
                        pit.classList.add('active-p1');
                        pit.onclick = () => this.makeMove(index, true);
                    } else if (this.currentPlayer === 2 && isP2Pit && myRole === 'guest') {
                        pit.classList.add('active-p2');
                        pit.onclick = () => this.makeMove(index, true);
                    }
                }
                return pit;
            }

            createStore(index) {
                const store = document.createElement('div');
                store.className = 'store';
                store.id = `pit-${index}`;
                store.textContent = this.board[index];
                return store;
            }

            async makeMove(index, shouldBroadcast) {
                if (this.animationRunning) return;
                this.animationRunning = true;

                if (shouldBroadcast) {
                    await supabaseClient.from('rooms').update({ 
                        last_move: index, last_move_by: myRole, updated_at: new Date() 
                    }).eq('room_id', roomID);
                }

                let cur = index;
                let seeds = this.board[index];
                this.board[index] = 0;
                this.updateUI();

                while (seeds > 0) {
                    await new Promise(r => setTimeout(r, 350));
                    cur = (cur + 1) % 16;
                    
                    // Lewati lubang besar lawan
                    if ((this.currentPlayer === 1 && cur === 15) || (this.currentPlayer === 2 && cur === 7)) {
                        cur = (cur + 1) % 16;
                    }

                    this.board[cur]++;
                    this.updateUI();
                    seeds--;
                }

                const myStore = this.currentPlayer === 1 ? 7 : 15;

                // Jika berhenti di lubang isi (berputar lagi)
                if (cur !== 7 && cur !== 15 && this.board[cur] > 1) {
                    this.animationRunning = false;
                    this.makeMove(cur, false);
                    return;
                }

                // Jika berhenti di lubang kosong sisi sendiri (Nembak)
                const isMySide = (this.currentPlayer === 1 && cur <= 6) || (this.currentPlayer === 2 && cur >= 8 && cur <= 14);
                if (isMySide && this.board[cur] === 1) {
                    const oppIdx = 14 - cur;
                    if (this.board[oppIdx] > 0) {
                        this.board[myStore] += (1 + this.board[oppIdx]);
                        this.board[cur] = 0;
                        this.board[oppIdx] = 0;
                        this.showNotif("🎯 TEMBAK!");
                    }
                }

                // Pindah Giliran kecuali berhenti di Store sendiri
                if (cur !== myStore) {
                    this.currentPlayer = 3 - this.currentPlayer;
                } else {
                    this.showNotif("✨ BONUS GILIRAN!");
                }

                this.animationRunning = false;
                this.renderBoard();
                this.updateUI();
                this.checkGameOver();
            }

            updateUI() {
                this.board.forEach((val, i) => {
                    const el = document.getElementById(`pit-${i}`);
                    if (el) el.textContent = val;
                });
                document.getElementById('p1-score').textContent = this.board[7];
                document.getElementById('p2-score').textContent = this.board[15];
                document.getElementById('p1-info').className = `player-info ${this.currentPlayer === 1 ? 'current-player' : ''}`;
                document.getElementById('p2-info').className = `player-info ${this.currentPlayer === 2 ? 'current-player' : ''}`;
                
                if (this.currentPlayer !== 0) {
                    document.getElementById('status').textContent = "Giliran: " + (this.currentPlayer === 1 ? hName : gName);
                }
            }

            showNotif(msg) {
                const n = document.getElementById('notif');
                n.textContent = msg; n.style.display = 'block';
                setTimeout(() => n.style.display = 'none', 2000);
            }

            checkGameOver() {
                const p1Empty = this.board.slice(0, 7).every(s => s === 0);
                const p2Empty = this.board.slice(8, 15).every(s => s === 0);
                if (p1Empty || p2Empty) {
                    this.gameActive = false;
                    alert("PERMAINAN SELESAI!");
                }
            }
        }

        async function submitSuit(choice) {
            const col = myRole === 'host' ? 'suit_host' : 'suit_guest';
            document.getElementById('suit-msg').textContent = "Menunggu lawan...";
            Array.from(document.getElementsByClassName('suit-btn')).forEach(b => b.disabled = true);
            await supabaseClient.from('rooms').update({ [col]: choice }).eq('room_id', roomID);
        }

        const game = new DakonGame();
    </script>
</body>
</html>
