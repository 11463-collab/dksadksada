<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Lobby - Menunggu Player</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; text-align: center; padding: 50px; color: #333; }
        .card { background: white; max-width: 500px; margin: auto; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .box { padding: 20px; border: 2px dashed #ccc; margin: 10px; border-radius: 15px; flex: 1; transition: 0.3s; position: relative; }
        .active { border: 2px solid #764ba2; background: #f3f0ff; transform: scale(1.02); }
        
        /* Status Ready Badge */
        .ready-badge { position: absolute; top: -10px; right: -10px; background: #2ecc71; color: white; padding: 5px 10px; border-radius: 10px; font-size: 0.8rem; font-weight: bold; display: none; z-index: 10; }
        .not-ready-badge { position: absolute; top: -10px; right: -10px; background: #e74c3c; color: white; padding: 5px 10px; border-radius: 10px; font-size: 0.8rem; font-weight: bold; display: none; z-index: 10; }

        .settings-panel { background: #f8f9fa; border-radius: 15px; padding: 15px; margin: 20px 0; text-align: left; border: 1px solid #ddd; }
        .setting-item { margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
        
        /* Button Styles */
        .btn-start { background: #764ba2; color: white; padding: 15px 30px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1rem; transition: 0.3s; }
        .btn-start:disabled { background: #ccc; cursor: not-allowed; opacity: 0.7; }
        .btn-ready { background: #2ecc71; color: white; padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; }
        .btn-not-ready { background: #e74c3c; color: white; padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; }
        
        input[type="text"], select { padding: 8px; border-radius: 5px; border: 1px solid #ccc; width: 130px; }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="roomTitle">Room: ...</h2>
        <div id="statusMsg">Menunggu Player 2 bergabung...</div>
        
        <div style="display:flex; margin-top: 30px; gap: 10px;">
            <div class="box active" id="p1-box">
                <b>PLAYER 1 (HOST)</b><br><span id="p1-name">...</span>
            </div>
            
            <div class="box" id="p2-box">
                <div id="readyBadge" class="ready-badge">READY</div>
                <div id="notReadyBadge" class="not-ready-badge">WAITING</div>
                <b>PLAYER 2</b><br><span id="p2-name">Kosong</span>
            </div>
        </div>

        <div id="hostSettings" class="settings-panel" style="display: none;">
            <h4 style="margin-top:0;">⚙️ Pengaturan Room</h4>
            <div class="setting-item">
                <span>Visibilitas:</span>
                <select id="visibilitySelect" onchange="updateRoomSettings()">
                    <option value="true">Publik (Terlihat)</option>
                    <option value="false">Privat (Sembunyi)</option>
                </select>
            </div>
            <div class="setting-item">
                <span>Password:</span>
                <input type="text" id="passInput" placeholder="Opsional..." onchange="updateRoomSettings()">
            </div>
        </div>

        <div id="actionArea" style="margin-top:20px;"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://yifnqncmsgbkvvjdgwae.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_F47wIask3Ld1QT8Hfvgu-Q_hxHPnYRj';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const p = new URLSearchParams(window.location.search);
        const room = p.get('room');
        const role = p.get('role'); // 'host' atau 'guest'
        let isRedirecting = false;
        let isPlayerReady = false;

        // Tampilkan settings jika user adalah Host
        if(role === 'host') {
            document.getElementById('hostSettings').style.display = 'block';
        }

        async function updateRoomSettings() {
            if(role !== 'host') return;
            const isPublic = document.getElementById('visibilitySelect').value === 'true';
            const password = document.getElementById('passInput').value;

            await supabaseClient.from('rooms').update({ 
                is_public: isPublic, 
                password: password 
            }).eq('room_id', room);
        }

        // Toggle Ready (Hanya untuk Player 2 / Guest)
        async function toggleReady() {
            const newStatus = !isPlayerReady;
            await supabaseClient.from('rooms').update({ 
                is_guest_ready: newStatus 
            }).eq('room_id', room);
        }

        async function checkStatus() {
            const { data, error } = await supabaseClient.from('rooms').select('*').eq('room_id', room).maybeSingle();
            
            if(!data) {
                if(role !== 'host') {
                    alert("Room telah ditutup oleh Host.");
                    window.location.href = 'index.html';
                }
                return;
            };

            document.getElementById('roomTitle').textContent = "Room: " + room;
            document.getElementById('p1-name').textContent = data.host_name;
            isPlayerReady = data.is_guest_ready;

            // Jika Player 2 sudah masuk
            if(data.guest_name) {
                document.getElementById('p2-name').textContent = data.guest_name;
                document.getElementById('p2-box').classList.add('active');
                
                // Update Badge Status
                document.getElementById('readyBadge').style.display = isPlayerReady ? 'block' : 'none';
                document.getElementById('notReadyBadge').style.display = isPlayerReady ? 'none' : 'block';

                if(role === 'host') {
                    // Tampilan Host
                    document.getElementById('statusMsg').textContent = isPlayerReady ? "Player 2 sudah siap!" : "Menunggu Player 2 bersiap...";
                    document.getElementById('actionArea').innerHTML = `
                        <button class="btn-start" onclick="startGame()" ${!isPlayerReady ? 'disabled' : ''}>
                            ${isPlayerReady ? 'MULAI PERMAINAN' : 'MENUNGGU PLAYER READY'}
                        </button>
                    `;
                } else {
                    // Tampilan Player 2
                    document.getElementById('statusMsg').textContent = isPlayerReady ? "Anda sudah siap!" : "Klik tombol di bawah jika sudah siap";
                    document.getElementById('actionArea').innerHTML = `
                        <button class="${isPlayerReady ? 'btn-not-ready' : 'btn-ready'}" onclick="toggleReady()">
                            ${isPlayerReady ? 'BATALKAN SIAP' : 'SAYA SIAP!'}
                        </button>
                    `;
                }
            } else {
                // Jika Player 2 belum ada
                document.getElementById('p2-name').textContent = "Mencari lawan...";
                document.getElementById('p2-box').classList.remove('active');
                document.getElementById('readyBadge').style.display = 'none';
                document.getElementById('notReadyBadge').style.display = 'none';
                document.getElementById('actionArea').innerHTML = "";
            }

            // Redirect ke Game jika dimulai
            if(data.is_started) {
                isRedirecting = true;
                window.location.href = `game.html?role=${role}&room=${room}&hostName=${data.host_name}&myName=${role==='host'?data.host_name:data.guest_name}`;
            }
        }

        async function startGame() { 
            if(!isPlayerReady) return alert("Player belum siap!");
            await supabaseClient.from('rooms').update({ is_started: true }).eq('room_id', room); 
        }

        // Hapus room otomatis jika Host keluar sebelum mulai
        window.addEventListener('beforeunload', async () => {
            if(role === 'host' && !isRedirecting) {
                const url = `${SUPABASE_URL}/rest/v1/rooms?room_id=eq.${room}`;
                navigator.sendBeacon(url, JSON.stringify({ method: 'DELETE' }));
            }
        });

        setInterval(checkStatus, 1500);
        checkStatus();
    </script>
</body>
</html>
