<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobby - Dakon Benevolent</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #764ba2;
            --secondary: #667eea;
            --success: #2ecc71;
            --danger: #e74c3c;
            --glass: rgba(255, 255, 255, 0.9);
            --aws-color: #3498db;
            --kor-color: #9b59b6;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, var(--secondary), var(--primary)); 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            color: #2d3436;
        }

        .card { 
            background: var(--glass); 
            width: 100%;
            max-width: 550px; 
            padding: 40px; 
            border-radius: 30px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.2); 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
            text-align: center;
        }

        .room-header { margin-bottom: 30px; }
        .room-header h2 { font-size: 2rem; margin: 0; color: var(--primary); }
        .room-id-tag { 
            background: #dddcdc; 
            padding: 5px 15px; 
            border-radius: 20px; 
            font-size: 0.9rem; 
            font-weight: bold; 
            display: inline-block;
            margin-top: 10px;
            cursor: pointer;
            transition: 0.3s;
        }
        .room-id-tag:hover { background: #ccc; cursor: text;}

        /* Server Badge */
        .server-badge {
            font-size: 0.7rem;
            padding: 3px 10px;
            border-radius: 10px;
            color: white;
            margin-left: 8px;
            vertical-align: middle;
            text-transform: uppercase;
        }
        .bg-aws { background: var(--aws-color); }
        .bg-kor { background: var(--kor-color); }

        .player-container { 
            display: flex; 
            gap: 20px; 
            margin: 30px 0;
        }

        .player-box { 
            flex: 1; 
            background: white; 
            padding: 25px 15px; 
            border-radius: 20px; 
            border: 3px solid transparent;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        .player-box i.user-icon { font-size: 3rem; margin-bottom: 15px; color: #dfe6e9; }
        .player-box.active { border-color: var(--primary); transform: translateY(-5px); }
        .player-box.active i.user-icon { color: var(--primary); }
        .player-box b { display: block; font-size: 0.8rem; text-transform: uppercase; color: #636e72; letter-spacing: 1px; }
        .player-box .name { font-size: 1.1rem; font-weight: 800; margin-top: 5px; }

        .badge {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: none;
        }
        .badge-ready { background: var(--success); }
        .badge-waiting { background: var(--danger); animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.05); }
            100% { transform: translateX(-50%) scale(1); }
        }

        .settings-panel { 
            background: rgba(0,0,0,0.03); 
            border-radius: 20px; 
            padding: 20px; 
            margin: 25px 0; 
            text-align: left; 
        }
        .settings-panel h4 { margin: 0 0 15px 0; display: flex; align-items: center; gap: 10px; }
        .setting-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        
        select, input { 
            padding: 10px; 
            border-radius: 10px; 
            border: 1px solid #ddd; 
            outline: none; 
            font-family: inherit;
        }

        .btn {
            border: none;
            border-radius: 15px;
            padding: 15px 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-start { background: var(--primary); color: white; box-shadow: 0 10px 20px rgba(118, 75, 162, 0.3); }
        .btn-start:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 15px 25px rgba(118, 75, 162, 0.4); }
        .btn-start:disabled { background: #b2bec3; cursor: not-allowed; }

        .btn-ready { background: var(--success); color: white; }
        .btn-not-ready { background: var(--danger); color: white; }

        .btn-exit { 
            background: transparent; 
            color: #636e72; 
            margin-top: 15px; 
            font-size: 0.9rem;
        }
        .btn-exit:hover { color: var(--danger); }

        .status-msg { font-weight: 500; color: #636e72; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="card">
        <div class="room-header">
            <h2><i class="fa-solid fa-gamepad"></i> Dakon Lobby</h2>
            <div class="room-id-tag" onclick="copyRoomID()" title="Klik untuk salin">
                <i class="fa-solid fa-hashtag"></i> <span id="roomTitle">ID: ...</span>
                <span id="srvBadge" class="server-badge">...</span>
            </div>
        </div>

        <div id="statusMsg" class="status-msg">Menghubungkan ke server...</div>
        
        <div class="player-container">
            <div class="player-box active" id="p1-box">
                <i class="fa-solid fa-crown user-icon" style="color: #f1c40f;"></i>
                <b>Host</b>
                <div class="name" id="p1-name">Memuat...</div>
            </div>
            
            <div class="player-box" id="p2-box">
                <div id="readyBadge" class="badge badge-ready"><i class="fa-solid fa-check"></i> READY</div>
                <div id="notReadyBadge" class="badge badge-waiting"><i class="fa-solid fa-clock"></i> WAITING</div>
                
                <i class="fa-solid fa-user user-icon" id="p2-icon"></i>
                <b>Opponent</b>
                <div class="name" id="p2-name">Kosong</div>
            </div>
        </div>

        <div id="hostSettings" class="settings-panel" style="display: none;">
            <h4><i class="fa-solid fa-sliders"></i> Pengaturan Room</h4>
            
            <div class="setting-item">
                <span><i class="fa-solid fa-server"></i> Lokasi Server</span>
                <b id="displayServer" style="color: var(--primary);">AWS (Singapore)</b>
            </div>

            <div class="setting-item">
                <span><i class="fa-solid fa-eye"></i> Visibilitas</span>
                <select id="visibilitySelect" onchange="updateRoomSettings()">
                    <option value="true">Publik</option>
                    <option value="false">Privat</option>
                </select>
            </div>
            <div class="setting-item">
                <span><i class="fa-solid fa-lock"></i> Password</span>
                <input type="text" id="passInput" placeholder="Opsional..." onchange="updateRoomSettings()">
            </div>
        </div>

        <div id="actionArea"></div>

        <button class="btn btn-exit" onclick="handleExit()">
            <i class="fa-solid fa-right-from-bracket"></i> Keluar dari Room
        </button>
    </div>

    <script>
        // CONFIG MULTI-SERVER
        const SERVERS = {
            AWS: {
                url: 'https://yifnqncmsgbkvvjdgwae.supabase.co',
                key: 'sb_publishable_F47wIask3Ld1QT8Hfvgu-Q_hxHPnYRj'
            },
            KOR: {
                url: 'https://qouaeainjscoidchwtgm.supabase.co',
                key: 'sb_publishable_3O3MN8Kvk__XDfwe5CO_Ug_ux1g33l-'
            }
        };

        const p = new URLSearchParams(window.location.search);
        const room = p.get('room');
        const role = p.get('role');
        const selectedServer = p.get('server') || 'SIN'; // Ambil server dari URL

        // Inisialisasi Supabase berdasarkan server yang dipilih
        const supabaseClient = window.supabase.createClient(
            SERVERS[selectedServer].url, 
            SERVERS[selectedServer].key
        );

        let isRedirecting = false;
        let isPlayerReady = false;

        // UI Initialization
        document.getElementById('srvBadge').textContent = selectedServer;
        document.getElementById('srvBadge').classList.add(selectedServer === 'AWS' ? 'bg-aws' : 'bg-kor');
        document.getElementById('displayServer').textContent = selectedServer === 'AWS' ? 'AWS (Singapore)' : 'KOR (Seoul)';

        if(role === 'host') {
            document.getElementById('hostSettings').style.display = 'block';
        }

        function copyRoomID() {
            navigator.clipboard.writeText(room);
            alert("ID Room berhasil disalin!");
        }

        async function updateRoomSettings() {
            if(role !== 'host') return;
            const isPublic = document.getElementById('visibilitySelect').value === 'true';
            const password = document.getElementById('passInput').value;
            await supabaseClient.from('rooms').update({ is_public: isPublic, password: password }).eq('room_id', room);
        }

        async function toggleReady() {
            const newStatus = !isPlayerReady;
            await supabaseClient.from('rooms').update({ is_guest_ready: newStatus }).eq('room_id', room);
        }

        async function handleExit() {
            if (!confirm("Keluar dari lobby sekarang?")) return;
            if (role === 'host') {
                await supabaseClient.from('rooms').delete().eq('room_id', room);
            } else {
                await supabaseClient.from('rooms').update({ guest_name: null, is_guest_ready: false }).eq('room_id', room);
            }
            isRedirecting = true;
            window.location.href = 'index.html';
        }

        async function checkStatus() {
            const { data, error } = await supabaseClient.from('rooms').select('*').eq('room_id', room).maybeSingle();
            
            if (!data) {
                if (!isRedirecting) {
                    alert("Room sudah tidak aktif atau Host telah keluar.");
                    window.location.href = 'index.html';
                }
                return;
            }

            if (role === 'guest' && !data.guest_name && !isRedirecting) {
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('roomTitle').textContent = room;
            document.getElementById('p1-name').textContent = data.host_name;
            isPlayerReady = data.is_guest_ready;

            const p2Box = document.getElementById('p2-box');
            const actionArea = document.getElementById('actionArea');

            if(data.guest_name) {
                document.getElementById('p2-name').textContent = data.guest_name;
                p2Box.classList.add('active');
                
                document.getElementById('readyBadge').style.display = isPlayerReady ? 'block' : 'none';
                document.getElementById('notReadyBadge').style.display = isPlayerReady ? 'none' : 'block';

                if(role === 'host') {
                    document.getElementById('statusMsg').textContent = isPlayerReady ? "Semua siap bermain!" : "Menunggu lawan bersiap...";
                    actionArea.innerHTML = `
                        <button class="btn btn-start" onclick="startGame()" ${!isPlayerReady ? 'disabled' : ''}>
                            <i class="fa-solid fa-play"></i> MULAI PERMAINAN
                        </button>`;
                } else {
                    document.getElementById('statusMsg').textContent = isPlayerReady ? "Menunggu Host memulai..." : "Siap untuk bertanding?";
                    actionArea.innerHTML = `
                        <button class="btn ${isPlayerReady ? 'btn-not-ready' : 'btn-ready'}" onclick="toggleReady()">
                            <i class="fa-solid ${isPlayerReady ? 'fa-xmark' : 'fa-check'}"></i> 
                            ${isPlayerReady ? 'BATALKAN SIAP' : 'SAYA SIAP!'}
                        </button>`;
                }
            } else {
                document.getElementById('p2-name').textContent = "Menunggu...";
                p2Box.classList.remove('active');
                document.getElementById('statusMsg').textContent = "Bagikan ID Room ke teman!";
                document.getElementById('readyBadge').style.display = 'none';
                document.getElementById('notReadyBadge').style.display = 'none';
                actionArea.innerHTML = '';
            }

            if(data.is_started) {
                isRedirecting = true;
                // Mengirim info server ke halaman game
                window.location.href = `8912308B123XJ/game.html?role=${role}&room=${room}&server=${selectedServer}&hostName=${data.host_name}&myName=${role==='host'?data.host_name:data.guest_name}`;
            }
        }

        async function startGame() { 
            if(!isPlayerReady) return;
            await supabaseClient.from('rooms').update({ is_started: true }).eq('room_id', room); 
        }

        window.addEventListener('beforeunload', async () => {
            if(role === 'host' && !isRedirecting) {
                // Gunakan Beacon API untuk menghapus room jika tab ditutup mendadak
                const url = `${SERVERS[selectedServer].url}/rest/v1/rooms?room_id=eq.${room}`;
                navigator.sendBeacon(url, JSON.stringify({ method: 'DELETE' }));
            }
        });

        setInterval(checkStatus, 1500);
        checkStatus();
    </script>
</body>
</html>
