<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Lobby - Dakon Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; text-align: center; padding: 50px; color: #333; }
        .lobby-card { background: white; max-width: 600px; margin: auto; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .player-container { display: flex; justify-content: center; gap: 20px; margin-top: 30px; }
        .player-box { width: 200px; padding: 25px; border: 2px dashed #ccc; border-radius: 15px; transition: 0.3s; position: relative; }
        .active { border-style: solid; border-color: #764ba2; background: #f3f0ff; transform: translateY(-5px); }
        .my-tag { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: #764ba2; color: white; padding: 2px 10px; border-radius: 10px; font-size: 0.7rem; }
        .btn-refresh { background: #2ecc71; color: white; border: none; padding: 10px 25px; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 20px; }
        .btn-refresh:hover { background: #27ae60; }
        .hidden { display: none; }
        .dots:after { content: '.'; animation: dots 1s steps(5, end) infinite;}
        @keyframes dots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60% { content: '...'; } 80%, 100% { content: ''; } }
    </style>
</head>
<body>
    <div class="lobby-card">
        <h2 id="room-info">Room: Checking...</h2>
        <p id="msg">Menunggu lawan bergabung<span class="dots"></span></p>

        <div class="player-container">
            <div class="player-box" id="box-p1">
                <div id="tag-p1" class="my-tag hidden">ANDA</div>
                <h3 id="p1-name">Menunggu...</h3>
                <small>HOST (PLAYER 1)</small>
            </div>

            <div class="player-box" id="box-p2">
                <div id="tag-p2" class="my-tag hidden">ANDA</div>
                <h3 id="p2-name">Kosong</h3>
                <small>GUEST (PLAYER 2)</small>
            </div>
        </div>
        <br>
        <button class="btn-refresh" onclick="checkPlayers()">🔄 Cek Status Manual</button>
    </div>

    <script>
        // --- KONFIGURASI SUPABASE ---
        const SUPABASE_URL = 'https://yifnqncmsgbkvvjdgwae.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_F47wIask3Ld1QT8Hfvgu-Q_hxHPnYRj';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const p = new URLSearchParams(window.location.search);
        const room = p.get('room');
        const myRole = p.get('role');
        const myName = p.get('hostName') || p.get('myName'); // Ambil nama dari URL

        let isRedirecting = false;

        async function checkPlayers() {
            if (isRedirecting || !room) return;

            document.getElementById('room-info').textContent = "Room: " + room;

            // Ambil data room dari Supabase
            const { data, error } = await supabaseClient
                .from('rooms')
                .select('*')
                .eq('room_id', room)
                .maybeSingle();

            if (error) return console.error(error);
            if (!data) return;

            // 1. Tampilkan Data Host (selalu ada jika host sudah buat room)
            if (data.host_name) {
                document.getElementById('p1-name').textContent = data.host_name;
                document.getElementById('box-p1').classList.add('active');
                if (myRole === 'host') document.getElementById('tag-p1').classList.remove('hidden');
            }

            // 2. Tampilkan Data Guest
            if (data.guest_name) {
                document.getElementById('p2-name').textContent = data.guest_name;
                document.getElementById('box-p2').classList.add('active');
                if (myRole === 'guest') document.getElementById('tag-p2').classList.remove('hidden');

                // 3. Jika Keduanya Sudah Ada, Pindah ke Game
                isRedirecting = true;
                document.getElementById('msg').innerHTML = "<b style='color:#764ba2'>Lawan Siap! Memulai Permainan...</b>";
                
                setTimeout(() => {
                    const gameUrl = `game.html?role=${myRole}&room=${room}&hostName=${data.host_name}&myName=${data.guest_name}`;
                    window.location.href = gameUrl;
                }, 2000);
            }
        }

        // Jalankan fungsi update nama di Supabase saat pertama kali masuk
        async function updateLobby() {
            if (myRole === 'host') {
                await supabaseClient.from('rooms').upsert({ room_id: room, host_name: myName });
            } else {
                await supabaseClient.from('rooms').update({ guest_name: myName }).eq('room_id', room);
            }
            checkPlayers();
        }

        // Cek otomatis setiap 2 detik
        setInterval(checkPlayers, 2000);
        window.onload = updateLobby;
    </script>
</body>
</html>
