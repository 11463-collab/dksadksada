<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobby Dakon - Congklak Benevolent</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea, #764ba2); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { display: flex; gap: 20px; max-width: 900px; width: 100%; flex-wrap: wrap; justify-content: center; }
        
        /* Glassmorphism Effect */
        .lobby-card, .server-list-card { background: rgba(255, 255, 255, 0.95); padding: 2rem; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
        .lobby-card { width: 320px; text-align: center; }
        .server-list-card { width: 500px; max-height: 500px; overflow-y: auto; }

        /* Server Item Styling */
        .server-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; transition: 0.2s; border-radius: 10px; margin-bottom: 5px; }
        .server-item:hover { background: #f1f2f6; }
        
        .server-info { text-align: left; flex-grow: 1; }
        .server-name { font-weight: bold; color: #2d3436; display: flex; align-items: center; gap: 8px; }
        .server-host { font-size: 0.75rem; color: #636e72; display: block; margin-top: 2px; }

        /* Badges */
        .badge-srv { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; color: white; font-weight: bold; text-transform: uppercase; }
        .bg-aws { background: #3498db; } /* Biru untuk AWS */
        .bg-kor { background: #9b59b6; } /* Ungu untuk KOR */
        .badge-lock { font-size: 0.7rem; color: #e17055; }

        /* Form Styling */
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin: 5px 0; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.3s; border-bottom: 4px solid rgba(0,0,0,0.2); }
        button:hover { transform: translateY(2px); border-bottom: 1px solid rgba(0,0,0,0.2); }
        
        .btn-host { background: #764ba2; color: white; }
        .btn-guest { background: #00b894; color: white; }
        .btn-join-small { background: #0984e3; color: white; border: none; padding: 6px 15px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; width: auto; }
        
        .divider { margin: 15px 0; color: #b2bec3; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }
        .empty-msg { color: #b2bec3; text-align: center; padding: 20px; font-style: italic; }
    </style>
</head>
<body>

    <div class="container">
        <div class="lobby-card">
            <h2 style="color: #6c5ce7; margin-top:0;">🎮 Congklak Benevolent</h2>
            <input type="text" id="playerName" placeholder="Nama Pemain">
            
            <div class="divider">Buat Room</div>
            <select id="serverTarget" style="width:100%; padding:10px; border-radius:10px; margin-bottom:10px; border:1px solid #ddd;">
                <option value="AWS">Server Northeast1 (Singapore)</option>
                <option value="KOR">Server Northeast3 (Korea)</option>
            </select>
            <button class="btn-host" onclick="startAsHost()">Create Room</button>

            <div class="divider">Join Manual</div>
            <input type="text" id="roomID" placeholder="ID Room">
            <button class="btn-guest" onclick="startAsGuest()">Join by ID</button>
        </div>

        <div class="server-list-card">
            <h3 style="margin-top:0; color: #2d3436;"><i class="fa-solid fa-earth-asia"></i> Daftar Server Online</h3>
            <div id="serverListContainer">
                <p class="empty-msg">Mencari server di seluruh dunia...</p>
            </div>
            <button onclick="fetchActiveServers()" style="background: transparent; color: #636e72; font-size: 0.75rem; border:none; text-decoration: underline; cursor:pointer;">🔄 Refresh List</button>
        </div>
    </div>

<script>
    // KONFIGURASI DUA SERVER
    const S1_CONF = {
        url: 'https://yifnqncmsgbkvvjdgwae.supabase.co',
        key: 'sb_publishable_F47wIask3Ld1QT8Hfvgu-Q_hxHPnYRj',
        name: 'AWS'
    };
    const S2_CONF = {
        url: 'https://qouaeainjscoidchwtgm.supabase.co',
        key: 'sb_publishable_3O3MN8Kvk__XDfwe5CO_Ug_ux1g33l-',
        name: 'KOR'
    };

    const clientAWS = window.supabase.createClient(S1_CONF.url, S1_CONF.key);
    const clientKOR = window.supabase.createClient(S2_CONF.url, S2_CONF.key);

    async function fetchActiveServers() {
        const container = document.getElementById('serverListContainer');
        try {
            const [resAWS, resKOR] = await Promise.all([
                clientAWS.from('rooms').select('room_id, host_name, password').is('guest_name', null).eq('is_public', true).limit(5),
                clientKOR.from('rooms').select('room_id, host_name, password').is('guest_name', null).eq('is_public', true).limit(5)
            ]);

            // KONSISTENSI: Menggunakan AWS dan KOR
            const allRooms = [
                ...(resAWS.data || []).map(r => ({ ...r, origin: 'AWS' })),
                ...(resKOR.data || []).map(r => ({ ...r, origin: 'KOR' }))
            ];

            if (allRooms.length === 0) {
                container.innerHTML = '<p class="empty-msg">Tidak ada room publik saat ini.</p>';
                return;
            }

            container.innerHTML = '';
            allRooms.forEach(srv => {
                const isLocked = srv.password && srv.password.trim() !== "";
                const badgeClass = srv.origin === 'AWS' ? 'bg-aws' : 'bg-kor';
                
                const item = document.createElement('div');
                item.className = 'server-item';
                item.innerHTML = `
                    <div class="server-info">
                        <span class="server-name">
                            <span class="badge-srv ${badgeClass}">${srv.origin}</span>
                            ${srv.room_id} 
                            ${isLocked ? '<i class="fa-solid fa-lock badge-lock"></i>' : ''}
                        </span>
                        <span class="server-host">Host: <b>${srv.host_name}</b></span>
                    </div>
                    <button class="btn-join-small" onclick="quickJoin('${srv.room_id}', '${srv.origin}', ${isLocked})">Join</button>
                `;
                container.appendChild(item);
            });
        } catch (err) {
            container.innerHTML = '<p class="empty-msg">Gagal memuat daftar server.</p>';
        }
    }

    async function quickJoin(roomID, origin, isLocked) {
        const name = document.getElementById('playerName').value;
        if (!name) return alert("Masukkan nama Anda!");

        const targetClient = origin === 'AWS' ? clientAWS : clientKOR;

        if (isLocked) {
            const { data } = await targetClient.from('rooms').select('password').eq('room_id', roomID).single();
            const passInput = prompt(`Room [${roomID}] diproteksi. Masukkan password:`);
            if (passInput !== data.password) return alert("Password salah!");
        }

        await targetClient.from('rooms').update({ guest_name: name }).eq('room_id', roomID);
        window.location.href = `lobby.html?role=guest&room=${roomID}&server=${origin}&myName=${name}`;
    }

    async function startAsHost() {
        const name = document.getElementById('playerName').value;
        const origin = document.getElementById('serverTarget').value; // AWS atau KOR
        const roomID = Math.random().toString(36).substring(2, 12);
        
        if (!name) return alert("Isi nama kamu!");
        const targetClient = origin === 'AWS' ? clientAWS : clientKOR;

        const { error } = await targetClient.from('rooms').upsert({ 
            room_id: roomID, 
            host_name: name, 
            is_public: true,
            is_started: false,
            created_at: new Date()
        });

        if (error) alert("Gagal: " + error.message);
        else window.location.href = `lobby.html?role=host&room=${roomID}&server=${origin}&hostName=${name}`;
    }

    async function startAsGuest() {
        const name = document.getElementById('playerName').value;
        const roomID = document.getElementById('roomID').value;
        if (!name || !roomID) return alert("Isi nama dan ID Room!");

        const [checkAWS, checkKOR] = await Promise.all([
            clientAWS.from('rooms').select('room_id, password').eq('room_id', roomID).maybeSingle(),
            clientKOR.from('rooms').select('room_id, password').eq('room_id', roomID).maybeSingle()
        ]);

        let origin = null;
        let roomData = null;

        if (checkAWS.data) { origin = 'AWS'; roomData = checkAWS.data; }
        else if (checkKOR.data) { origin = 'KOR'; roomData = checkKOR.data; }

        if (!origin) return alert("Room tidak ditemukan!");
        const targetClient = origin === 'AWS' ? clientAWS : clientKOR;

        if (roomData.password && roomData.password.trim() !== "") {
            const passInput = prompt("Masukkan Password Room:");
            if (passInput !== roomData.password) return alert("Password salah!");
        }

        await targetClient.from('rooms').update({ guest_name: name }).eq('room_id', roomID);
        window.location.href = `lobby.html?role=guest&room=${roomID}&server=${origin}&myName=${name}`;
    }

    fetchActiveServers();
    setInterval(fetchActiveServers, 10000);
</script>
</body>
</html>
