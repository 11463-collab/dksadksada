<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Lobby Dakon Online</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea, #764ba2); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { display: flex; gap: 20px; max-width: 800px; width: 100%; flex-wrap: wrap; justify-content: center; }
        .lobby-card { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 350px; text-align: center; }
        
        /* Style untuk List Server */
        .server-list-card { background: white; padding: 1.5rem; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 350px; max-height: 400px; overflow-y: auto; }
        .server-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; transition: 0.2s; }
        .server-item:hover { background: #f9f9f9; }
        .server-info { text-align: left; }
        .server-name { font-weight: bold; color: #764ba2; display: block; }
        .server-host { font-size: 0.8rem; color: #666; }
        .btn-join-small { background: #00b894; color: white; border: none; padding: 5px 12px; border-radius: 5px; cursor: pointer; font-size: 0.8rem; }
        
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin: 5px 0; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-host { background: #764ba2; color: white; }
        .btn-guest { background: #00b894; color: white; }
        .divider { margin: 15px 0; color: #999; font-size: 0.8rem; }
        .empty-msg { color: #999; font-style: italic; margin-top: 20px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="container">
        <div class="lobby-card">
            <h2>🎮 Dakon Online</h2>
            <input type="text" id="playerName" placeholder="Masukkan Nama Anda">
            <p>----(Pilih Opsi)----</p>
            <input type="text" id="roomID" placeholder="ID Room (Contoh: SERU123)">
            
            <button class="btn-host" onclick="startAsHost()">Buat Room Baru (Host)</button>
            <div class="divider">ATAU</div>
            <button class="btn-guest" onclick="startAsGuest()">Gabung Room Manual</button>
        </div>

        <div class="server-list-card">
            <h3>🌐 Server Aktif</h3>
            <div id="serverListContainer">
                <p class="empty-msg">Mencari server...</p>
            </div>
            <button onclick="fetchActiveServers()" style="background: #eee; color: #333; margin-top: 10px; font-size: 0.7rem; padding: 5px;">🔄 Refresh List</button>
        </div>
    </div>

   <script>
        const SUPABASE_URL = 'https://yifnqncmsgbkvvjdgwae.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_F47wIask3Ld1QT8Hfvgu-Q_hxHPnYRj';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- FITUR LIST SERVER ---
        async function fetchActiveServers() {
            const container = document.getElementById('serverListContainer');
            
            // Ambil room yang guest_name-nya masih kosong (menunggu lawan)
            const { data, error } = await supabaseClient
                .from('rooms')
                .select('room_id, host_name')
                .is('guest_name', null)
                .order('created_at', { ascending: false })
                .limit(10);

            if (error) return console.error(error);

            if (!data || data.length === 0) {
                container.innerHTML = '<p class="empty-msg">Tidak ada server aktif. Buatlah satu!</p>';
                return;
            }

            container.innerHTML = '';
            data.forEach(srv => {
                const item = document.createElement('div');
                item.className = 'server-item';
                item.innerHTML = `
                    <div class="server-info">
                        <span class="server-name">${srv.room_id}</span>
                        <span class="server-host">Host: ${srv.host_name}</span>
                    </div>
                    <button class="btn-join-small" onclick="quickJoin('${srv.room_id}')">Join</button>
                `;
                container.appendChild(item);
            });
        }

        // Fungsi join cepat dari list
        function quickJoin(roomName) {
            const name = document.getElementById('playerName').value;
            if (!name) return alert("Masukkan nama Anda dulu!");
            
            document.getElementById('roomID').value = roomName;
            startAsGuest();
        }

        // --- FUNGSI ASLI ---
        async function startAsHost() {
            const name = document.getElementById('playerName').value;
            const room = document.getElementById('roomID').value;
            if (!name || !room) return alert("Isi nama dan ID Room!");

            const { error } = await supabaseClient
                .from('rooms')
                .upsert({ 
                    room_id: room, 
                    host_name: name, 
                    guest_name: null,
                    last_move: null, 
                    last_move_by: null,
                    created_at: new Date()
                });

            if (error) alert("Gagal: " + error.message);
            else window.location.href = `lobby.html?role=host&room=${room}&hostName=${name}`;
        }

        async function startAsGuest() {
            const name = document.getElementById('playerName').value;
            const room = document.getElementById('roomID').value;
            if (!name || !room) return alert("Isi nama dan ID Room!");

            const { data } = await supabaseClient
                .from('rooms')
                .select('room_id')
                .eq('room_id', room)
                .maybeSingle();

            if (data) {
                await supabaseClient.from('rooms').update({ guest_name: name }).eq('room_id', room);
                window.location.href = `lobby.html?role=guest&room=${room}&myName=${name}`;
            } else {
                alert("Room tidak ditemukan!");
            }
        }

        // Jalankan fetch saat load dan setiap 5 detik
        fetchActiveServers();
        setInterval(fetchActiveServers, 5000);
</script>
</body>
</html>
